reventDefault();b.disabled=true;s.textContent='Submitting…';google.script.run.withSuccessHandler(function(r){s.textContent='Registration received! Reference: '+r.reference+'. Total: ৳'+r.amount+'. Payment pending verification. Save your reference.';f.reset();update();b.disabled=false}).withFailureHandler(function(e){s.textContent=e.message||'Registration failed';b.disabled=false}).submitRegistration(Object.fromEntries(new FormData(f).entries()))};</script></body></html>
