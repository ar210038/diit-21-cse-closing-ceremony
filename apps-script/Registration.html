<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px Arial,sans-serif;color:#123d34;background:#f4f6ef;margin:0;padding:18px}form{max-width:620px;margin:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 8px 25px #0001}h2{margin:0 0 8px}label{display:block;margin-top:16px;font-weight:bold;font-size:13px}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #cdd9d2;border-radius:5px;font:inherit}button{background:#123d34;color:#fff;border:0;padding:14px;width:100%;margin-top:22px;border-radius:5px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}small{color:#576e61}.total{display:flex;justify-content:space-between;margin-top:20px;padding:17px;background:#f1f4ec;font-weight:bold}#status{line-height:1.6;overflow-wrap:anywhere}a{color:#236a52}</style></head><body><form id="reg"><h2>🎓 21st CSE Registration</h2><small>DIIT Closing Ceremony · Deadline 27 October 2026</small><label>Student full name *<input name="name" required maxlength="100"></label><label>Student ID *<input name="studentId" required maxlength="45"></label><label>Email *<input type="email" name="email" required></label><label>Phone *<input name="phone" type="tel" required placeholder="01XXXXXXXXX"></label><label>Number of guests *<select name="guests" id="guests"><option value="0">0 guests</option><option value="1">1 guest</option><option value="2">2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option><option value="5">5 guests</option><option value="6">6 guests</option><option value="7">7 guests</option><option value="8">8 guests</option><option value="9">9 guests</option><option value="10">10 guests</option></select></label><label>Payment method *<select name="paymentMethod" id="method"><option value="cash">Cash</option><option value="bkash">bKash — manual verification</option></select></label><label id="tx" hidden>bKash transaction ID (optional)<input name="transactionId" maxlength="40"></label><p><small>Cash or bKash: 01940372926 · Account: 1073055620001. Payment is verified manually before your QR ticket is emailed.</small></p><div class="total"><span>Total</span><span id="total">৳1,000</span></div><button id="send">Submit Registration</button><p id="status" role="status" aria-live="polite"></p><small>For changes, contact Al-Rafi Chowdhury: 01940372926.</small></form><script>const f=document.getElementById('reg'),g=document.getElementById('guests'),m=document.getElementById('method'),t=document.getElementById('total'),tx=document.getElementById('tx'),s=document.getElementById('status'),b=document.getElementById('send');function update(){t.textContent='৳'+(1000+Number(g.value)*500).toLocaleString('en-BD');tx.hidden=m.value!=='bkash'}g.onchange=update;m.onchange=update;update();f.onsubmit=function(e){e.preventDefault();b.disabled=true;s.textContent='Submitting…';google.script.run.withSuccessHandler(function(r){s.textContent='Registration received! Reference: '+r.reference+'. Total: ৳'+r.amount+'. Payment pending verification. Save your reference.';f.reset();update();b.disabled=false}).withFailureHandler(function(e){s.textContent=e.message||'Registration failed';b.disabled=false}).submitRegistration(Object.fromEntries(new FormData(f).entries()))};</script></body></html>
